<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de talleres · Bootcamp UIP</title><style>body{font:16px system-ui;background:#071b43;color:white;margin:0}main{max-width:900px;margin:auto;padding:25px}.card{background:#103567;padding:20px;margin:16px 0;border-radius:14px}input,select{display:block;width:95%;padding:12px;margin:7px 0 14px}button{background:#ffba42;color:#092048;border:0;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer}a{color:#9de7ff}</style></head><body><main><a href="/level-up.html">← LEVEL UP</a><h1>Control de talleres — Ruta de Experiencias</h1><p>Validaciones reservadas para coordinación. No compartir códigos de participantes fuera del equipo autorizado.</p><p id="status">Comprobando autorización...</p><section id="admin" class="card" hidden><label>Participante registrado<select id="person"></select></label><label>Asistencia / actividad<select id="activity"><option value="ia">IA LAB</option><option value="story">MY STORY</option><option value="connect">CONNECT</option><option value="game">Innovation Hub · partida</option><option value="entrepreneur">Innovation Hub · emprendimiento</option></select></label><button id="validate">Confirmar asistencia presencial</button><p id="result"></p></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
const c=supabase.createClient(window.BOOTCAMP_SUPABASE_URL,window.BOOTCAMP_SUPABASE_ANON_KEY),$=x=>document.getElementById(x);
async function init(){const {data:{user}}=await c.auth.getUser();if(!user){$('status').textContent='Debes iniciar sesión.';return}const a=await c.from('bootcamp_profiles').select('is_admin').eq('id',user.id).single();if(a.error||!a.data?.is_admin){$('status').textContent='Acceso restringido a administradores.';return}const p=await c.from('bootcamp_profiles').select('id,full_name,career').order('full_name');if(p.error){$('status').textContent=p.error.message;return}for(const x of p.data){const o=document.createElement('option');o.value=x.id;o.textContent=(x.full_name||'Sin nombre')+' · '+(x.career||'Sin carrera');$('person').append(o)}$('status').textContent='Administrador autorizado · Validaciones de asistencia';$('admin').hidden=false}
$('validate').onclick=async()=>{if(!confirm('¿Confirmas presencialmente la asistencia de este participante?'))return;const r=await c.rpc('bootcamp_levelup_validate_attendance',{p_user_id:$('person').value,p_activity:$('activity').value});$('result').textContent=r.error?'Error: '+r.error.message:'Asistencia validada en Supabase.'};init();
</script></body></html>
